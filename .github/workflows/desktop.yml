name: desktop

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-22.04
          - name: linux-arm64
            os: ubuntu-22.04-arm
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Install both sides and the desktop toolchain
        shell: bash
        run: |
          ./formdeck install
          ./formdeck install-desktop
      - name: Build the desktop bundle
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            ./formdeck desktop build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            ./formdeck desktop build
          fi
      - name: Name the macOS updater archive by architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch=$([ "$(uname -m)" = arm64 ] && echo aarch64 || echo x64)
          cd src-tauri/target/release/bundle/macos
          for f in *.app.tar.gz *.app.tar.gz.sig; do
            [ -e "$f" ] && mv "$f" "${f/.app.tar.gz/_$arch.app.tar.gz}"
          done
          ls
      - uses: actions/upload-artifact@v4
        with:
          name: formdeck-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.sig

  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formdeck-linux-x64
          path: linux-x64
      - name: Stage the deb for the manifest
        shell: bash
        run: cp "$(ls linux-x64/deb/*.deb | head -1)" src-tauri/flatpak/formdeck.deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: formdeck.flatpak
          manifest-path: src-tauri/flatpak/ai.nodemode.formdeck.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: formdeck-flatpak
          if-no-files-found: error
          path: formdeck.flatpak

  release:
    needs: [build, flatpak]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Updater feed (latest.json)
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os
          tag = os.environ['GITHUB_REF_NAME']
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          targets = {'darwin-aarch64': '*aarch64.app.tar.gz', 'darwin-x86_64': '*x64.app.tar.gz',
                     'linux-x86_64': '*amd64.AppImage', 'linux-aarch64': '*aarch64.AppImage',
                     'windows-x86_64': '*-setup.exe'}
          platforms = {}
          for key, pattern in targets.items():
              for f in sorted(glob.glob('bundles/**/' + pattern, recursive=True)):
                  if os.path.exists(f + '.sig'):
                      platforms[key] = {'signature': open(f + '.sig').read().strip(), 'url': base + os.path.basename(f)}
                      break
          if platforms:
              feed = {'version': tag.lstrip('v'), 'notes': f'formdeck {tag}', 'platforms': platforms,
                      'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
              json.dump(feed, open('bundles/latest.json', 'w'), indent=2)
              print('latest.json written for', ', '.join(platforms))
          else:
              print('no updater signatures (TAURI_SIGNING_PRIVATE_KEY unset); latest.json not written')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: bundles/**/*
