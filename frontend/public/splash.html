    .card { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 18px; background: #0a0a0a; }

te(38.4 31.4) rotate(8)"><rect x="-19.4" y="-10.7" width="38.8" height="21.4" rx="1.3" fill="#000" fill-opacity=".45" transform="translate(.4 1.2)"/><rect x="-19.4" y="-10.7" width="38.8" height="21.4" rx="1.3" fill="url(#splash-paint)"/><rect x="-16.8" y="-8.4" width="14.4" height="2" rx="1" fill="#fff" fill-opacity=".96"/><g fill="#fff"><circle cx="-16.2" cy="-3.6" r=".6"/><circle cx="-16.2" cy="-.6" r=".6"/><circle cx="-16.2" cy="2.4" r=".6"/><g fill-opacity=".62"><rect x="-14.9" y="-4.15" width="11.2" height="1.1" rx=".55"/><rect x="-14.9" y="-1.15" width="9.2" height="1.1" rx=".55"/><rect x="-14.9" y="1.85" width="10.4" height="1.1" rx=".55"/></g></g><g clip-path="url(#splash-pic)"><rect x="2.6" y="-8.1" width="15.2" height="16.2" fill="url(#splash-sky)"/><circle cx="12.9" cy="-3.6" r="3.2" fill="#FFF3D6" fill-opacity=".18"/><circle cx="12.9" cy="-3.6" r="2" fill="#FFF3D6"/><path d="M2.6 2.6 Q9 .4 17.8 2.2 V8.1 H2.6Z" fill="#3B2A72"/><path d="M8.6 8.1 C8.2 6.4 10.4 5.2 9.6 3.9 C9.2 3.2 9.9 2.8 10.6 2.8 C10.2 3.6 11.2 4.6 11 5.9 C10.8 7 11.6 7.6 11.8 8.1Z" fill="#A9B4EC"/><path d="M3.4 3 L4.6 -3.4 L5.8 3Z M5.2 3 L6 -.8 L6.8 3Z M13.6 2.6 L15 -3 L16.4 2.6Z M15.6 2.8 L16.6 -.6 L17.6 2.8Z" fill="#1E1438"/></g><rect x="2.6" y="-8.1" width="15.2" height="16.2" rx=".9" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".35"/></g></g><rect x=".4" y=".4" width="63.2" height="63.2" rx="14" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width=".8"/></svg><p id="stage">Starting the formdeck engine</p><div class="track" role="progressbar" aria-label="Loading formdeck"><div class="fill" id="fill"></div></div></div>
<script>
(function () {
  var MIN = 2600, t0 = performance.now(), cap = 0.3, shown = 0, done = false;
  var fill = document.getElementById('fill'), label = document.getElementById('stage');
  var stages = { engine: [0.6, 'Loading formdeck'], page: [0.85, 'Loading your decks'], ready: [0.94, 'Almost ready'], done: [1, 'Ready'] };
  window.fdBoot = function (s) {
    var st = stages[s];
    if (!st || st[0] <= cap) return;
    cap = st[0];
    label.textContent = st[1];
    if (s === 'done') done = true;
  };
  function frame(now) {
    var f = Math.min(1, (now - t0) / MIN);
    var want = done ? 1 : Math.min(cap, 0.97 * (1 - Math.pow(1 - f, 2)));
    shown += (want - shown) * (done ? 0.35 : 0.12);
    fill.style.transform = 'scaleX(' + shown.toFixed(4) + ')';
    if (shown < 0.999) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  try { window.__TAURI_INTERNALS__.invoke('splash_ready'); } catch (e) {}
})();
</script>
