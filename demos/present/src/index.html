<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>FormDeck Demo: Present</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { background: #111111; margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #app { visibility: hidden; height: 100%; }
    body.app-ready #app { visibility: visible; }
  </style>
  <script>
(function () {
  try {
    var raw = localStorage.getItem('nodemode_ui_settings');
    if (raw) { var s = JSON.parse(raw); if (s.theme === 'light' || s.theme === 'sand') document.documentElement.style.background = '#ecebe6'; }
  } catch (e) {}
})();
  </script>
  <script type="module" src="./main.ts"></script>
</head>
<body>
  <div id="app"></div>
  <div id="overlay-root"></div>
  <div id="toast-root"></div>
</body>
</html>
